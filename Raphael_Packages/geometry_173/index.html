<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raphael 173 — Research Map</title><style>
:root{color-scheme:dark;font-family:system-ui,Arial,sans-serif;background:#101827;color:#e3ecfb}*{box-sizing:border-box}body{margin:0}.hero{padding:20px 25px;background:linear-gradient(115deg,#172d48,#182235);border-bottom:1px solid #334257}h1{margin:0 0 6px;font-size:23px}.sub{color:#b6c9dd;font-size:13px}.layout{display:grid;grid-template-columns:minmax(280px,360px) 1fr;min-height:70vh}.sidebar{border-right:1px solid #35475e;padding:15px;max-height:90vh;overflow:auto}.filter{width:100%;padding:10px;border-radius:8px;border:1px solid #455873;background:#122135;color:#fff;margin-bottom:10px}#records{display:grid;gap:6px}.item{padding:9px;border:1px solid #344861;border-radius:6px;cursor:pointer;background:#192a3e;text-align:left;color:#dceafe}.item:hover,.item.active{border-color:#96c5eb;background:#234061}.num{display:inline-block;color:#96c5eb;font-size:12px;width:40px}.details{padding:24px;max-width:1000px}.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#a7bad1}h2{margin:5px 0 14px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{padding:13px;border:1px solid #394e65;border-radius:8px;background:#1a2b40}.metric b{display:block;font-size:22px;margin-top:6px}.notice{border-left:3px solid #d9b76d;background:#2d2b28;padding:12px;margin:14px 0;border-radius:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:14px;background:#17273c;border:1px solid #32485f;border-radius:8px;overflow-wrap:anywhere}.card p{margin:8px 0 0;font-size:14px;line-height:1.5}canvas{max-width:100%;background:#0d1a2c;border-radius:8px;border:1px solid #32465e}a{color:#82c8fc}small{color:#9db2c9}.chip{display:inline-block;border:1px solid #4f6f8a;color:#b2d5f2;padding:4px 8px;border-radius:20px;font-size:11px;margin-bottom:10px}@media(max-width:750px){.layout{display:block}.sidebar{max-height:250px;border-right:0;border-bottom:1px solid #35475e}.grid{grid-template-columns:1fr}}
</style></head><body><div class="hero"><h1>RAPHAEL / GEO-MATRICES · 173 RESEARCH POSITIONS</h1><div class="sub">Source-aligned map and mathematical scale model — unminted, not 173 verified independent 3D meshes or physical elements</div></div><main class="layout"><aside class="sidebar"><input id="search" class="filter" aria-label="Search catalogue" placeholder="Find slot, name, family, J/U ID…"><select id="zone" class="filter" aria-label="Filter zone"><option value="">All research zones</option></select><div class="sub" id="count"></div><div id="records"></div></aside><section class="details" id="detail"><p>Loading research map…</p></section></main><script>
let rows=[];const el=id=>document.getElementById(id);const text=(v,d='Not supplied')=>v==null||v===''?d:String(v);const esc=v=>text(v,'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));
function draw(r){const c=el('facecanvas'),ctx=c?.getContext('2d');if(!ctx)return;ctx.clearRect(0,0,c.width,c.height);const arr=(r.reconciled_face_inventory||r.draft_face_inventory||'').toLowerCase();const faces=[['triangle',3],['square',4],['pentagon',5],['hexagon',6],['octagon',8],['decagon',10]].filter(v=>arr.includes(v[0]));faces.push(...(!faces.length?[['indicative only',7]]:[]));const N=faces.length;faces.forEach(([name,sides],i)=>{let ox=150+85*Math.cos(i*Math.PI*2/N),oy=100+62*Math.sin(i*Math.PI*2/N);ctx.beginPath();for(let j=0;j<sides;j++){let a=(j/sides)*Math.PI*2-Math.PI/2;let x=ox+26*Math.cos(a),y=oy+26*Math.sin(a);if(!j)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.closePath();ctx.fillStyle=`hsl(${205+i*27},65%,${32+i*3}%)`;ctx.fill();ctx.strokeStyle='#9bd3f5';ctx.lineWidth=1.8;ctx.stroke()});ctx.font='12px system-ui';ctx.fillStyle='#a5bdd6';ctx.fillText('FACE-SET SCHEMATIC — NOT EXACT MESH',14,188)}
function pick(z){const r=rows.find(x=>x.slot===z);if(!r)return;document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',Number(x.dataset.slot)===z));const k=r.reference_counts||{},d=r.draft_counts||{},links=r.references||{};el('detail').innerHTML=`<span class="chip">${esc(r.zone)} · ${esc(r.evidence_status)}</span><h2>#${z} · ${esc(r.reference_name)}</h2><div class="metrics"><div class="metric"><span class="label">Vertices (reference)</span><b>${esc(text(k.V,'—'))}</b></div><div class="metric"><span class="label">Edges (reference)</span><b>${esc(text(k.E,'—'))}</b></div><div class="metric"><span class="label">Faces (reference)</span><b>${esc(text(k.F,'—'))}</b></div></div><div class="notice"><b>Research status:</b> ${esc(r.verification.geometry_in_Raphael_metric)}. Physical link to atomic number ${z} is hypothetical. The canvas is a face-inventory icon only.</div><div class="grid"><div class="card"><div class="label">Schematic</div><canvas id="facecanvas" width="300" height="200"></canvas><p><small>Exact mesh coordinates/faces not supplied in this commit.</small></p></div><div class="card"><div class="label">Geometric identity</div><p><b>Source name:</b> ${esc(r.draft_name)}</p><p><b>Canonical pointer:</b> ${esc(text(r.canonical_geometry_id))}</p><p><b>Original V/E/F:</b> ${esc([d.V,d.E,d.F].join(' / '))}</p><p><b>Reference face inventory:</b> ${esc(text(r.reconciled_face_inventory,r.draft_face_inventory))}</p></div><div class="card"><div class="label">Scale / proposed interdomain model</div><p>R(${z}) = R₀ φ<sup>${z-1}</sup></p><p>Ratio to first = ${r.golden_scale.ratio_to_first.toExponential(5)}.</p><p><b>Physical role:</b> ${esc(r.proposed_interdomain_role)}</p></div><div class="card"><div class="label">Evidence and review</div><p>${esc(r.conflict_note)}</p><p><b>Coordinates:</b> ${esc(r.verification.coordinates)}</p><p><b>Workbook row:</b> ${r.workbook_source.row}</p>${links.geometry_source?`<p><a href="${esc(links.geometry_source)}" target="_blank" rel="noopener">Geometry source</a></p>`:''}</div></div>`;draw(r);history.replaceState(null,'','#'+z)}
function filter(){let q=el('search').value.trim().toLowerCase(),z=el('zone').value;let a=rows.filter(r=>(!z||r.zone===z)&&[r.slot,r.reference_name,r.draft_name,r.canonical_geometry_id,r.family].join(' ').toLowerCase().includes(q));el('count').textContent=`${a.length} of 173 positions`;el('records').innerHTML=a.map(r=>`<button class="item" data-slot="${r.slot}"><span class="num">${String(r.slot).padStart(3,'0')}</span>${esc(r.reference_name)}</button>`).join('');el('records').querySelectorAll('.item').forEach(b=>b.onclick=()=>pick(Number(b.dataset.slot)))}
fetch('./catalogue.json').then(r=>r.json()).then(d=>{rows=d.entries;for(const z of [...new Set(rows.map(x=>x.zone))]){let op=document.createElement('option');op.value=z;op.textContent=z.replaceAll('_',' ');el('zone').appendChild(op)}el('search').oninput=filter;el('zone').onchange=filter;filter();pick(Math.max(1,Math.min(173,Number(location.hash.slice(1))||1)))}).catch(e=>el('detail').innerHTML='<div class="notice">Load through an HTTP server, for example <code>python -m http.server 8000</code>, then open /index.html.</div>');
</script></body></html>
